services:
  # ========================================
  # 后端服务
  # ========================================
  anime-backend:
    build:
      context: .
      dockerfile: ./dockerfile
    container_name: anime-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./uploads:/uploads
    networks:
      - shared-infra

  # ========================================
  # Nginx（主入口 — 路径分流）
  # /anime → 本项目前端   /api/ → 本项目后端   /agent → 另一服务
  # ========================================;
  anime-nginx:
    image: nginx
    container_name: anime-nginx
    ports:
      - "5173:5173"
    volumes:
      - "./frontend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf"
      - "./frontend/nginx/html:/usr/share/nginx/html"
    depends_on:
      - anime-backend
    networks:
      - shared-infra

networks:
  shared-infra:
    name: shared-infra
    external: true
