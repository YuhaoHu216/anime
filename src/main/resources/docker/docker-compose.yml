services:
  # ========================================
  # 后端服务
  # ========================================
  anime-api:
    image: anime-api:latest
    build:
      context: .
      dockerfile: ./dockerfile
    container_name: anime-api
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # JVM 内存限制（老年代实际用量 ~68MB，留一倍余量）
      - JAVA_OPTS=-Xmx180m -Xms180m -XX:MaxMetaspaceSize=80m -XX:+UseG1GC
    volumes:
      - ./uploads:/uploads
    # Docker 硬限制（heap 180M + metaspace 80M + overhead）
    mem_limit: 280m
    restart: unless-stopped
    networks:
      - shared-infra

  # ========================================
  # Nginx（主入口 — 路径分流）
  # /anime → 本项目前端   /api/ → 本项目后端   /agent → 另一服务
  # ========================================
  anime-web:
    image: nginx
    container_name: anime-web
    ports:
      - "5173:5173"
    volumes:
      - "./frontend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf"
      - "./frontend/nginx/html:/usr/share/nginx/html"
    depends_on:
      - anime-api
    restart: unless-stopped
    networks:
      - shared-infra

networks:
  shared-infra:
    name: shared-infra
    external: true
