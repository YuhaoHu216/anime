# ========================================
# 公共配置（所有环境共享）
# ========================================

server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: anime
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB


mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Knife4j (Swagger) 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: top.huyuhao.anime.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT 配置
jwt:
  secret: ${JWT_SECRET:animeBackendSecretKeyForJwtToken2026!@#}
  expiration: 31536000  # token 过期时间（秒），365 天

# 应用自定义配置
app:
  upload:
    cover-dir: covers
    avatar-dir: avatars

# Bangumi API 代理（翻墙访问 api.bgm.tv）
bangumi:
  proxy:
    host: ${BGM_PROXY_HOST:127.0.0.1}
    port: ${BGM_PROXY_PORT:7890}
